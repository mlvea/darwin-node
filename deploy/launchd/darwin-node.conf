# darwin-node launchd logs.
# Install this file as /etc/newsyslog.d/darwin-node.conf.
#
# logfilename                    [owner:group]  mode  count  size  when  flags
#
# size is kilobytes. when=* rotates when the file reaches that size, not
# on a clock. count is the number of compressed archives kept besides the
# live file. root:admin and mode 640 are newsyslog's default ownership:
# the admin group can read the logs. J bzip2-compresses archives. N does
# not signal a process. launchd holds these descriptors and does not
# reopen them, so the new file receives output after the job next starts.
/var/log/darwin-node/stdout.log  root:admin     640   5      1024  *     JN
/var/log/darwin-node/stderr.log  root:admin     640   5      1024  *     JN
