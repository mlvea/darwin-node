name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -short -count=1 -timeout 90s
      - name: license files
        run: |
          test -s LICENSE
          test -s NOTICE
          test -s THIRD_PARTY_NOTICES
          grep -q 'Copyright (c) 2025 codehex' NOTICE
          grep -q 'WAKAYAMA Shirou' NOTICE
          grep -q 'Copyright 2009 The Go Authors' NOTICE
          grep -q 'github.com/Code-Hex/vz' THIRD_PARTY_NOTICES
          grep -q 'gopsutil' THIRD_PARTY_NOTICES
      - name: dist
        run: make dist

  e2e:
    name: e2e (self-hosted)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, darwin-node-e2e]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test (including clonefile)
        run: go test ./... -count=1 -timeout 120s
      - name: note
        run: echo "VM-boot e2e is documented in docs/testing.md and must be run with a baked image on this runner."
