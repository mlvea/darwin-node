version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    # errcheck is not enabled. A full run reports about 50 unchecked
    # Closes, most of them in pkg/guest and pkg/hostport. Those trees
    # are owned by other batches.
    # pkg/guest and cmd/guest-agent are excluded for the same reason:
    # staticcheck and unused findings there are left for that batch.
    presets: []
    paths:
      - pkg/guest
      - cmd/guest-agent

formatters:
  enable:
    - gofmt
  exclusions:
    presets: []
