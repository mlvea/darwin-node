apiVersion: v1
kind: Pod
metadata:
  name: macos-ci
spec:
  containers:
    - name: macos
      image: registry.example.com/macos:15
      resources:
        requests:
          cpu: "4"
          memory: 8Gi
          darwin.node/vm: "1"
      volumeMounts:
        - name: cfg
          mountPath: /etc/ci
        - name: scratch
          mountPath: /scratch
      readinessProbe:
        exec:
          command: ["/usr/bin/true"]
        initialDelaySeconds: 30
      livenessProbe:
        exec:
          command: ["/usr/bin/true"]
        periodSeconds: 30
    - name: logship
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 3600; done"]
  volumes:
    - name: cfg
      configMap:
        name: ci-config
    - name: scratch
      emptyDir: {}
  tolerations:
    - key: darwin.node/macos
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: virtual-kubelet.io/provider
      operator: Equal
      value: darwin-node
      effect: NoSchedule
  nodeSelector:
    kubernetes.io/os: darwin
